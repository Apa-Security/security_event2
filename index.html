<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>در حال انتقال...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff00;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
            text-align: center;
            overflow: hidden;
        }
        
        .loader {
            border: 4px solid #111;
            border-top: 4px solid #00ff00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* این کلاس یک لایه شفاف روی کل صفحه می‌کشد */
        #invisible-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            cursor: pointer;
            text-decoration: none;
            /* شفافیت کامل تا کاربر چیزی نبیند */
            opacity: 0; 
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2 id="status-text">در حال اتصال به سرور امن...</h2>
    <p style="color: gray; font-size: 0.8em; margin-top: 10px;">(برای تایید هویت، روی صفحه کلیک کنید)</p>

    <!-- این همون لینک نامرئی و بزرگیه که کل صفحه رو پوشونده -->
    <a id="invisible-link" href="#" download="WARNING_DATA_LEAK.txt"></a>

    <script>
        // متنی که داخل فایل دانلودی قرار می‌گیرد
        const fileContent = ⚠️ توجه ⚠️\n\nاین یک فایل تست از طرف غرفه امنیت است.\nشما این فایل را باز کردید، اما اگر این یک بدافزار واقعی بود، اکنون سیستم شما آلوده شده بود!\n\nهیچ‌گاه به سایت‌های ناشناس مراجعه نکنید و روی لینک‌های مشکوک کلیک نکنید.\n\nموفق باشید - تیم امنیت;

        // ساخت فایل متنی به صورت زنده
        const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        
        // متصل کردن فایل ساخته شده به لینک نامرئی
        const downloadLink = document.getElementById('invisible-link');
        downloadLink.href = url;

        // وقتی کاربر روی صفحه (همان لینک نامرئی) کلیک کرد، پیام تغییر کند
        downloadLink.addEventListener('click', function() {
            setTimeout(function() {
                document.getElementById('status-text').innerText = "فایل با موفقیت روی دستگاه شما ذخیره شد!";
                document.getElementById('status-text').style.color = "red";
                document.querySelector('.loader').style.display = "none";
            }, 500);
        });
    </script>

</body>
</html>
