<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایید هویت</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff00;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
            text-align: center;
        }

        .btn-verify {
            background-color: #00ff00;
            color: black;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            margin-top: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px #00ff00;
            transition: 0.3s;
        }

        .btn-verify:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="content-box">
        <h2 style="margin-bottom: 10px;">سیستم تایید هویت</h2>
        <p style="color: gray; font-size: 1em; max-width: 300px; margin: 0 auto;">
            برای تایید هویت و اتصال امن به سرور، روی دکمه زیر کلیک کنید.
        </p>
        
        <!-- دکمه‌ای که کاربر باید روی آن کلیک کند -->
        <button id="downloadBtn" class="btn-verify">تایید هویت و اتصال</button>
    </div>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', function() {
            // ۱. متنی که داخل فایل قرار می‌گیرد
            const fileContent = ⚠️ توجه ⚠️\n\nاین یک فایل تست از طرف غرفه امنیت است.\nشما این فایل را با کلیک روی یک دکمه ناشناس دانلود کردید.\nاگر این یک بدافزار واقعی بود، اکنون سیستم شما آلوده شده بود!\n\nهیچ‌گاه به سایت‌های ناشناس اعتماد نکنید.\n\nموفق باشید - تیم امنیت;
            
            // ۲. ساخت فایل متنی (Blob)
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            
            // ۳. ایجاد یک لینک موقت برای دانلود و کلیک خودکار روی آن
            const tempLink = document.createElement('a');
            tempLink.href = url;
            tempLink.download = 'SYSTEM_WARNING.txt'; // اسم فایلی که دانلود می‌شود
            document.body.appendChild(tempLink);
            tempLink.click();
            
            // ۴. پاکسازی لینک موقت
            document.body.removeChild(tempLink);
            window.URL.revokeObjectURL(url);

            // ۵. تغییر ظاهر صفحه برای ترساندن کاربر
            document.getElementById('content-box').innerHTML = 
                <h2 style="color: red; font-size: 2em; text-shadow: 0 0 10px red; margin-bottom: 15px;">⚠️ دستگاه شما آلوده شد ⚠️</h2>
                <p style="color: white; font-size: 1.1em;">فایل مخرب با موفقیت دانلود و اجرا شد!</p>
                <p style="color: gray; font-size: 0.9em; margin-top: 20px;">(لطفاً فایلی که دانلود شد را باز کنید)</p>
            ;
        });
    </script>

</body>
</html>
