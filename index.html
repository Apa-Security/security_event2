<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>در حال انتقال...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: pointer; /* تبدیل نشانگر ماوس به حالت کلیک برای گول زدن کاربر */
            direction: rtl;
            text-align: center;
        }
        
        .loader {
            border: 4px solid #111;
            border-top: 4px solid #00ff00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body id="trick-body">

    <div class="loader"></div>
    <h2 id="status-text">در حال اتصال به سرور امن...</h2>
    <p style="color: gray; font-size: 0.8em; margin-top: 10px;">(برای تایید هویت، روی صفحه کلیک کنید)</p>

    <script>
        // متنی که داخل فایل دانلودی قرار می‌گیرد
        const fileContent = ⚠️ توجه ⚠️

این یک فایل تست از طرف غرفه امنیت است.
شما این فایل را باز کردید، اما اگر این یک بدافزار واقعی بود، اکنون سیستم شما آلوده شده بود!

هیچ‌گاه به سایت‌های ناشناس مراجعه نکنید و فایل‌هایی که به صورت خودکار دانلود می‌شوند را باز نکنید.

موفق باشید - تیم امنیت;

        // اسم فایلی که دانلود می‌شود
        const fileName = "WARNING_DATA_LEAK.txt";

        // تابع اصلی برای تولید و دانلود فایل
        function forceDownload() {
            // ساختن فایل در حافظه مرورگر
            let blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            let url = window.URL.createObjectURL(blob);
            
            // ساخت یک لینک مخفی و کلیک روی آن
            let a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            
            // پاکسازی
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);

            // تغییر پیام صفحه بعد از دانلود
            document.getElementById('status-text').innerText = "عملیات انجام شد!";
            document.getElementById('status-text').style.color = "red";
        }

        // تلاش اول: دانلود خودکار بعد از ۱.۵ ثانیه (ممکن است توسط مرورگر بلاک شود)
        setTimeout(function() {
            forceDownload();
        }, 1500);

        // تلاش دوم: تله لمسی! 
        // اگر مرورگر دانلود خودکار را بلاک کرد، هر کجای صفحه کلیک یا لمس شود، فایل دانلود می‌شود
        document.getElementById('trick-body').addEventListener('click', function() {
            forceDownload();
        });
    </script>

</body>
</html>
