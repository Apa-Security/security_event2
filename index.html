<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایید هویت</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff00;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
            text-align: center;
        }
        
        .loader {
            border: 4px solid #111;
            border-top: 4px solid #00ff00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-fake {
            background-color: #00ff00;
            color: black;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 30px;
            display: inline-block;
            box-shadow: 0 0 15px #00ff00;
        }
    </style>
</head>
<body>

    <div id="content-box">
        <div class="loader" style="margin: 0 auto 20px auto;"></div>
        <h2>اتصال برقرار شد</h2>
        <p style="color: gray; font-size: 0.9em; margin-top: 10px;">برای تایید هویت و ورود به سامانه روی دکمه زیر کلیک کنید</p>
        
        <!-- دکمه واقعی دانلود که با Data URI کار می‌کند -->
        <a id="download-btn" class="btn-fake" href="#" download="HACKED_DATA.txt">تایید هویت و ورود</a>
    </div>

    <script>
        // متنی که داخل فایل قرار می‌گیرد
        const text = "⚠️ توجه ⚠️\n\nاین یک فایل تست از طرف غرفه امنیت است.\nشما این فایل را باز کردید، اما اگر این یک بدافزار واقعی بود، اکنون سیستم شما آلوده شده بود!\n\nهیچ‌گاه به سایت‌های ناشناس مراجعه نکنید و روی لینک‌های مشکوک کلیک نکنید.\n\nموفق باشید - تیم امنیت";
        
        // تبدیل متن به فرمت قابل دانلود مستقیم (Data URI)
        const dataStr = "data:text/plain;charset=utf-8," + encodeURIComponent(text);
        
        const btn = document.getElementById('download-btn');
        btn.setAttribute("href", dataStr);

        // تغییر ظاهر صفحه بعد از کلیک
        btn.addEventListener('click', function() {
            setTimeout(function() {
                document.getElementById('content-box').innerHTML = 
                    <h2 style="color: red; font-size: 2em; text-shadow: 0 0 10px red;">⚠️ دانلود فایل مخرب آغاز شد ⚠️</h2>
                    <p style="color: white;">اطلاعات دستگاه شما در حال استخراج است...</p>
                ;
            }, 500);
        });
    </script>

</body>
</html>
